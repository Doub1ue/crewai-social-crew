# Brand / account configuration for the crew.
# Set on 2026-11-17 with best-judgment defaults (World, at Anthony's
# request) around his ANPayment identity. Edit freely — the crew and the
# card graphics read everything from here.

account:
  name: "ANPayment"                # e.g. the Facebook Page name
  platform: "facebook"             # facebook | instagram (publishing targets a FB Page)
  niche: "practical productivity and free tools for small business owners and freelancers"
  topics:                          # recurring themes Scout (the Researcher) should watch
    - "staying on top of email and daily tasks"
    - "free and low-cost tools for small businesses"
    - "posting consistently on social media without burning out"
    - "simple AI tips for everyday business work"
  tone: "friendly, clear, and helpful — no hype, no clickbait"
  posts_per_run: 3                 # how many drafts Quill (the Writer) should produce per run
  hashtag_limit: 3                 # max hashtags per post (keeps posts non-spammy)

# Branding for the generated image cards (see graphics/make_card.js).
# After each run, every queued post gets a PNG card in output/images/
# drawn with these colors and the handle below.
brand:
  background_color: "#14213d"      # deep navy
  text_color: "#ffffff"
  accent_color: "#fca311"          # warm amber (top bar, divider, handle)
  handle: "@anpayment"             # shown at the bottom of every card
  card_width: 1080                 # square, sized for Facebook / Instagram
  card_height: 1080
