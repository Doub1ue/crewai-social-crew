# Brand / account configuration for the crew.
# Fill this in with the real account details before a live run.

account:
  name: "Your Account Name"        # e.g. the Facebook Page name
  platform: "facebook"             # facebook | instagram (publishing targets a FB Page)
  niche: "your niche here"         # what the account is about, in a few words
  topics:                          # recurring themes the Researcher should watch
    - "topic one"
    - "topic two"
  tone: "friendly, clear, and helpful — no hype, no clickbait"
  posts_per_run: 3                 # how many drafts the Writer should produce per run
  hashtag_limit: 3                 # max hashtags per post (keeps posts non-spammy)

# Branding for the generated image cards (see graphics/make_card.js).
# After each run, every queued post gets a PNG card in output/images/
# drawn with these colors and the handle below.
brand:
  background_color: "#14213d"      # deep navy
  text_color: "#ffffff"
  accent_color: "#fca311"          # warm amber (top bar, divider, handle)
  handle: "@yourhandle"            # shown at the bottom of every card
  card_width: 1080                 # square, sized for Facebook / Instagram
  card_height: 1080
